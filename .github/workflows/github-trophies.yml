name: Generate GitHub Trophies

on:
  schedule:
    # Refresh once a week
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: aditya-kg
          output: github-trophies.svg
          theme: darkhub
          columns: 4
          margin_width: 10
          margin_height: 10
          no_frame: true

      - name: Commit trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-trophies.svg

          git diff --cached --quiet && exit 0

          git commit -m "Update GitHub trophy stats"
          git push
